<!doctype html>
<html lang="en" data-theme="hud">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>HQ</title>
<script>try { document.documentElement.dataset.theme = localStorage.getItem("hq-theme") || "hud"; } catch {}</script>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="hud.css">
<link rel="stylesheet" href="nova.css">
<link rel="stylesheet" href="live.css">
<link rel="stylesheet" href="canvas.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><img src="icon.svg" alt=""><span>HQ</span></div>
    <nav id="nav">
      <div class="nav-group">Live</div>
      <a href="#code" data-view="code"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M13.5 4l-3 16"/></svg><span>Code</span></a>
      <a href="#canvas" data-view="canvas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="8" height="7" rx="1.5"/><rect x="13" y="4" width="8" height="11" rx="1.5"/><rect x="3" y="13" width="8" height="7" rx="1.5"/><path d="M13 19h8"/></svg><span>Canvas</span></a>
      <a href="#tasks" data-view="tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg><span>Tasks</span><b id="nTasks" class="count"></b></a>
      <div class="nav-group">Command</div>
      <a href="#command" data-view="command"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.5"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/></svg><span>Command</span></a>
      <a href="#home" data-view="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3.5" y="4.5" width="17" height="16" rx="2.5"/><path d="M3.5 9.5h17M8 2.5v4M16 2.5v4"/></svg><span>Today</span></a>
      <a href="#assistant" data-view="assistant"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></svg><span>JARVIS</span></a>
      <div class="nav-group">Work</div>
      <a href="#projects" data-view="projects"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg><span>Projects</span></a>
      <a href="#planner" data-view="planner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="5" cy="6" r="2.5"/><circle cx="19" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M7.5 6h9M6.2 8.2l4.6 7.6M17.8 8.2l-4.6 7.6"/></svg><span>Planner</span></a>
      <a href="#calendar" data-view="calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3.5" y="4.5" width="17" height="16" rx="2.5"/><path d="M3.5 9.5h17M8 13h2M14 13h2M8 16.5h2"/></svg><span>Calendar</span></a>
      <a href="#roadmap" data-view="roadmap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 6h10M7 12h12M3 18h8"/><circle cx="16" cy="6" r="1.5"/><circle cx="14" cy="18" r="1.5"/></svg><span>Roadmap</span></a>
      <a href="#inbox" data-view="inbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3.5 13.5l2.6-8a2 2 0 0 1 1.9-1.4h8a2 2 0 0 1 1.9 1.4l2.6 8v5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/><path d="M3.5 13.5h5l1.5 2.5h4l1.5-2.5h5"/></svg><span>Inbox</span><b id="nInbox" class="count"></b></a>
      <div class="nav-group">Agent</div>
      <a href="#outbox" data-view="outbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 6.5l8.5 6.5 8.5-6.5"/></svg><span>Outbox</span><b id="nOutbox" class="count warn"></b></a>
      <a href="#missions" data-view="missions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 19l14-7L5 5l2.5 7z"/><path d="M7.5 12H13"/></svg><span>Missions</span><b id="nApprovals" class="count warn"></b></a>
      <a href="#settings" data-view="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Settings</span></a>
    </nav>
    <div class="side-foot"><div id="engine"></div><button type="button" class="power" id="powerBtn" title="Power-down sequence (screen only)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg><span>Power down</span></button></div>
  </aside>

  <div class="main">
    <header class="top">
      <button class="side-btn" id="sideBtn" type="button" aria-label="Menu" aria-expanded="false" title="Menu (M)"><i></i></button>
      <button class="searchbtn" id="openPal" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span>Search or jump to…</span><kbd class="kbd">Ctrl K</kbd></button>
      <div id="psw" class="psw"></div>
      <form id="capture" autocomplete="off">
        <input id="captureText" placeholder="Capture a thought…  ( / )">
      </form>
      <div id="pills" class="pills"></div>
      <div id="clock" class="clock"></div>
    </header>
    <main id="view" tabindex="-1"></main>
    <section id="ops" class="ops" hidden aria-label="Live operations"></section>
    <footer id="ticker" class="ticker" aria-label="Recent events"></footer>
  </div>
</div>

<div id="modal" class="modal" hidden><div class="modal-card" role="dialog" aria-modal="true"><div id="modalBody"></div></div></div>
<div id="pal" class="pal" hidden>
  <div class="pal-card" role="dialog" aria-label="Command palette">
    <div class="pal-in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="palInput" placeholder="Search projects, reminders, notes… or type a command" autocomplete="off"></div>
    <div class="pal-list" id="palList"></div>
    <div class="pal-foot"><span><kbd class="kbd">↑↓</kbd> move</span><span><kbd class="kbd">Enter</kbd> open</span><span><kbd class="kbd">Esc</kbd> close</span></div>
  </div>
</div>
<div id="boot" class="boot" hidden></div>
<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
<script src="hud.js"></script>
<script src="views.js"></script>
<script src="nova.js"></script>
<script src="live.js"></script>
<script src="music.js"></script>
<script src="picker.js"></script>
<script src="canvas.js"></script>
</body>
</html>
